[pytest]
# Pytest configuration for AI Usage Tracker

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
# Pin the fixture loop scope instead of letting pytest-asyncio warn about it
# on every run (52 warnings per suite) and pick an implicit scope.
asyncio_default_fixture_loop_scope = function

# An auto-generated test id built from a str/bytes value over 100 characters is an error
# at collection, on every platform. pytest keeps the node id in PYTEST_CURRENT_TEST and
# Windows caps an environment variable at 32767 characters, so an oversized id used to
# fail only on the native Windows suite. Since 9.2 the default strategy ("short") already
# replaces such a value with argname+index, so ids stay short either way; "disallow" is the
# stricter policy: the over-long value must be given an explicit id,
# pytest.param(..., id="...") or parametrize(..., ids=[...]), instead of being silently
# replaced. The key needs pytest 9.2 (older releases only warn about an unknown option),
# hence the minversion.
minversion = 9.2
parametrize_long_str_id_strategy = disallow

# Coverage settings
addopts =
    --strict-markers
    --tb=short
    -v
    # A stalled test has to fail, not hang. Without a timeout a wedged worker
    # takes the whole run with it: the xdist master sits there with every
    # worker's CPU at zero, the pre-push hook blocks instead of failing, and
    # the only output is a stack dump from the timeout, if there is one.
    # The method is the platform default -- a signal on POSIX, a thread on
    # Windows -- so a timeout fails the test where the platform can, and
    # kills the worker where it cannot. 300s is far above the slowest test
    # in the suite (40s on Windows, 11s on Linux).
    --timeout=300
    # Enable coverage when pytest-cov is installed:
    # --cov=app
    # --cov-report=term-missing

# Python path
pythonpath = .

# Markers for test categorization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    windows: tests whose subject is the Windows platform; the native Windows
        gate runs only these (see `scripts/dev_checks.py test-windows`)
