[pytest]
# Pytest configuration for AI Usage Tracker

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
# Pin the fixture loop scope instead of letting pytest-asyncio warn about it
# on every run (52 warnings per suite) and pick an implicit scope.
asyncio_default_fixture_loop_scope = function

# Coverage settings
addopts =
    --strict-markers
    --tb=short
    -v
    # Enable coverage when pytest-cov is installed:
    # --cov=app
    # --cov-report=term-missing

# Python path
pythonpath = .

# Markers for test categorization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    windows: tests whose subject is the Windows platform; the native Windows
        gate runs only these (see `scripts/dev_checks.py test-windows`)
