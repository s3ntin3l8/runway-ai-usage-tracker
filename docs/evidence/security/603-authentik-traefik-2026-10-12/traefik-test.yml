http:
  routers:
    rw603-private:
      rule: Host(`runway-603.test.local`)
      entryPoints:
      - websecure
      priority: 10
      service: rw603
      middlewares:
      - rw603-chain
      tls:
        certResolver: cloudflare
    rw603-fleet:
      rule: Host(`runway-603.test.local`) && (Path(`/api/v1/fleet/ingest`)
        || Path(`/api/v1/fleet/config`) || Path(`/api/v1/fleet/credentials/manifest`))
      entryPoints:
      - websecure
      priority: 100
      service: rw603
      middlewares:
      - rw603-strip
      tls:
        certResolver: cloudflare
    rw603-outpost:
      rule: Host(`runway-603.test.local`) && PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
      - websecure
      priority: 150
      service: rw603-outpost
      middlewares: []
      tls:
        certResolver: cloudflare
    rw603-recovery:
      rule: Host(`runway-603.test.local`) && Path(`/validation-break-glass/api/v1/system/dashboard-layout`)
      entryPoints:
      - websecure
      priority: 200
      service: rw603
      middlewares:
      - rw603-operator
      - rw603-strip
      - rw603-recovery-prefix
      tls:
        certResolver: cloudflare
  middlewares:
    rw603-strip:
      headers:
        customRequestHeaders:
          X-authentik-username: ''
          X-authentik-email: ''
          X-authentik-groups: ''
          X-authentik-name: ''
          X-authentik-uid: ''
          X-authentik-jwt: ''
          X-authentik-meta-jwks: ''
          X-authentik-meta-outpost: ''
          X-authentik-meta-provider: ''
          X-authentik-meta-app: ''
          X-authentik-meta-version: ''
          Remote-User: ''
          X-Forwarded-User: ''
          X-Forwarded-Email: ''
          X-Forwarded-Groups: ''
    rw603-auth:
      forwardAuth:
        address: http://authentik-outpost:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
        - X-authentik-username
        - X-authentik-email
        - X-authentik-groups
    rw603-chain:
      chain:
        middlewares:
        - rw603-strip
        - rw603-auth
    rw603-recovery-prefix:
      stripPrefix:
        prefixes:
        - /validation-break-glass
    rw603-operator:
      ipAllowList:
        sourceRange:
        - 192.0.2.10/32
  services:
    rw603:
      loadBalancer:
        servers:
        - url: http://runway-603:8765
    rw603-outpost:
      loadBalancer:
        servers:
        - url: http://authentik-outpost:9000
