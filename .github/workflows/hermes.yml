name: Hermes (review)

# Two ways to get a review from the s3ntin3l8-hermes bot:
#   1. auto-review    -> exactly once per PR: on `opened` if it starts non-draft,
#      or on `ready_for_review` if it starts as a draft.
#   2. on-demand-review -> comment "@s3ntin3l8-hermes Review" (or "Triage" on
#      an issue) any time you want another look -- including every follow-up
#      after the initial auto-review.
# Both call the same reusable workflow (s3ntin3l8/.github/.github/workflows/
# hermes-review.yml@main) with a different `mode`, gated by github.event_name
# so each job only runs for its own trigger.
#
# IMPORTANT: do NOT add `synchronize` back. It re-triggers a fresh review on
# EVERY subsequent push, which on a PR under active iteration is an unbounded
# review loop (each review's comments prompt more commits, each commit fires
# another review...). Confirmed in practice on PR #16: 5 pushes produced 3
# separate Hermes review submissions (not 5 -- corrected count, re-checked
# against the actual review timestamps). `ready_for_review` is safe to keep
# alongside `opened`: a draft can flip to ready and back to draft and ready
# again, firing this event more than once, but repeat `ready_for_review`
# events are bounded by the reusable workflow's own "Guard against
# re-trigger (auto mode only)" step, which skips the run once this bot
# already has a non-dismissed review on the PR -- that guard was actually
# broken until s3ntin3l8/.github#54 (a `gh api --jq --arg` invocation that
# silently failed and always reported "no prior review found"), fixed there.
#
# SECURITY: this repo is public and the reusable workflow runs on a self-hosted
# runner. For a `pull_request` event, GitHub runs the workflow FILE from the PR's
# own head ref, i.e. a fork's copy of this file, on whatever runner the `if:`
# lets it reach. Without the `head.repo.full_name` guard below, any stranger
# could open a fork PR whose version of auto-review's job runs arbitrary steps
# on that runner -- fork PRs get no secrets and a read-only token, but the
# runner itself (its filesystem and LAN access) is the trust boundary, not the
# token. The on-demand path is unaffected: `issue_comment` always runs the
# DEFAULT BRANCH's copy of this file, so the author_association gate there is
# sufficient on its own; a maintainer's @mention on a fork PR still works.
# (The same fork guard is also enforced inside the reusable workflow itself,
# as defense-in-depth -- belt-and-braces, not redundant.)
on:
  pull_request:
    types: [opened, ready_for_review]
    # `opened`           => review once, if the PR starts non-draft.
    # `ready_for_review`  => review once, if the PR started as a draft (its
    # `opened` event is skipped below since draft was true at that point).
  issue_comment:
    types: [created]
    # Covers both PR-conversation comments and issue comments. The reusable
    # workflow's "Check mention" step enforces the "@s3ntin3l8-hermes" substring
    # in on-demand mode (default), so a plain comment without the mention is a
    # cheap no-op, not a review.

jobs:
  # `auto-review` deliberately excludes `mullion/task-*` branches (see the
  # job's own `if:` below) -- Task Master's own review agent is the terminal
  # review for its tasks (s3ntin3l8/mullion-session-manager#1003, ported
  # from that repo's #998). It excludes release-please PRs, which open as
  # `github-actions[bot]` -- a changelog PR has nothing for a code review to
  # say (ported from mullion-session-manager's hermes.yml).
  #
  # It does NOT exclude dependabot PRs. A version bump can change a runtime
  # tool version without saying so: #627 moved the installed cosign CLI from
  # v2.2.4 to v3.0.6, a major-version jump the bump body does not mention,
  # landing a version covered by GHSA-fx35-mq7g-6g98 (high severity).
  # Excluding dependabot is what lost us that review.
  #
  # A dependabot-authored `pull_request` run sees only the *Dependabot* secret
  # store, so it needs HERMES_APP_ID, HERMES_APP_PRIVATE_KEY and
  # HERMES_API_KEY under Settings -> Secrets and variables -> Dependabot.
  # Without them the shared workflow's Preflight step skips the review with a
  # notice.
  #
  # `on-demand-review` is untouched by any of this -- a human can always
  # explicitly ask for a second opinion via `@s3ntin3l8-hermes Review`.
  auto-review:
    # NOTE: excluding by PR *author* (github.event.pull_request.user.login),
    # not github.actor -- on `ready_for_review`, github.actor is whoever
    # clicked "Ready for review", which is not necessarily who opened the
    # PR. Author-based exclusion keeps working on both trigger types.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 's3ntin3l8-hermes[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'mullion/task-')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@03fbdae8cda323122c232f7530db0648d17a85b8 # main
    with:
      mode: auto # review on trigger, no @mention needed
      mention-trigger: s3ntin3l8-hermes
      # Dispatch through Hermes' Runs API and poll the run to a terminal
      # status: the check goes red when the review fails, instead of turning
      # green the moment the request is accepted (which is how a saturated
      # gateway used to read as "relayed"). This repo has two runners, so the
      # polling job does not queue the other self-hosted jobs behind it.
      hermes-use-runs: true
    secrets: inherit # pragma: allowlist secret

  on-demand-review:
    # Same trusted-commenter gate as claude.yml (#192) -- otherwise any user on
    # this public repo could post "@s3ntin3l8-hermes" and trigger a run that
    # inherits the HERMES_* secrets and executes on the self-hosted runner.
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor != 's3ntin3l8-hermes[bot]' &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@03fbdae8cda323122c232f7530db0648d17a85b8 # main
    with:
      mention-trigger: s3ntin3l8-hermes # mode: on-demand is the reusable workflow's default
      # See the auto-review job above: poll the run instead of firing and
      # forgetting, so a review that failed is a red check rather than a
      # silent no-op.
      hermes-use-runs: true
    secrets: inherit # pragma: allowlist secret
