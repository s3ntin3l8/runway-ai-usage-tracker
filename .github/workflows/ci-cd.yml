name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    uses: s3ntin3l8/.github/.github/workflows/ci-python.yml@8cbee823b2c24a947211641a99240c37f3055e74 # main
    with:
      python-version: '3.12'
      # Total line coverage is 91.6%; the floor keeps ~6 points of headroom
      # for variance while still failing a real regression.
      coverage-fail-under: '85'
      # mypy and pip-audit are advisory-only by default in the shared
      # workflow. This repo's baseline is clean, so make them hard gates here
      # rather than leaving the type check to the Windows job.
      strict-checks: true
      # Run the suite in four workers. `--dist loadfile` keeps every test
      # module inside one worker, so module-scoped fixtures and import-time
      # setup stay together. This is the difference between a 5-minute test
      # step and a 90-second one.
      test-parallel: '4'
      # Only the files this push touched can have introduced a secret.
      # detect-secrets matches a known secret by filename, hash and type -- not
      # by line number -- so a secret that shifts lines is still recognised,
      # and the hook rewrites the baseline's line number and fails the build
      # until the baseline is refreshed. That is why a change to a baselined
      # file needs `make secrets-baseline` in the same change.
      detect-secrets-scope: 'changed'
      # Without this the pip cache key comes from `**/requirements.txt`, so a
      # change to requirements-dev.txt never busts it. The two files it
      # includes have to be listed too: `hashFiles` hashes the files it is
      # given, it does not follow `-r` includes.
      cache-dependency-path: |
        requirements.txt
        requirements-dev.txt
        requirements-test.txt
        requirements-lint.txt
    # Job-level concurrency, so a new push to this pull request cancels the
    # previous run of *this* job without touching the rest of the workflow.
    # It has to live here rather than in the shared workflow: inside a called
    # workflow `github.workflow` is the caller's name and the group is
    # namespaced by the caller, so two calls to the same shared workflow from
    # one caller would share a group and cancel each other.
    concurrency:
      group: test-python-${{ github.ref }}
      cancel-in-progress: true
    secrets: inherit

  test-frontend:
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@8cbee823b2c24a947211641a99240c37f3055e74 # main
    with:
      # Node 24 ships npm 11, the first npm that writes the libc metadata
      # npm needs to pick the glibc or musl build of an optional native
      # package. npm 10 strips it from every lockfile it rewrites.
      node-version: '24'
      working-directory: 'webapp'
      cache-dependency-path: 'webapp/package-lock.json'
      build-script: 'build'
      # 'test:coverage' emits coverage/coverage-summary.json (vitest v8), which
      # turns on the reusable workflow's Codecov upload for the frontend.
      test-script: 'test:coverage'
      # Gate on total line coverage (currently ~93%); buffer for variance.
      coverage-fail-under: '85'
      strict-checks: true
      # The Python job above already scans the whole repository for secrets.
      # Doing it again here cost ~50s per run for the same answer.
      detect-secrets: false
    concurrency:
      group: test-frontend-${{ github.ref }}
      cancel-in-progress: true
    secrets: inherit

  windows:
    # Native Windows coverage of the static checks. The Windows *suite* runs
    # in windows-native-suite.yml, on main pushes and nightly; the modules
    # whose subject is the Windows platform run in `windows/specific` below.
    #
    # Advisory: it is not a required status check, so it does not decide
    # whether a pull request merges.
    runs-on: windows-latest
    # ruff + mypy + pip-audit take ~1.2 minutes on a healthy runner; the budget
    # only has to absorb a very slow runner, not the suite.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lint.txt
      - name: Install canonical Python dependencies
        # The static gate's set, not the union: this job runs ruff, mypy and
        # pip-audit, and none of them needs the test suite's packages.
        run: python scripts/dev_checks.py install-python --set lint
      - name: Run the native Windows static gate
        run: python scripts/dev_checks.py lint

  windows-specific:
    # The tests whose subject is the Windows platform: the native socket and
    # handle semantics, the installer packaging rules and the console code
    # pages. Everything else in the suite runs on the Windows runner in
    # windows-native-suite.yml, on main pushes and nightly.
    #
    # The split exists because the full suite on Windows cost ~11 runner-
    # minutes per pull request -- the single largest advisory cost in the
    # repository -- for coverage that a native runner is not the only way to
    # get. The modules below genuinely need one.
    #
    # Advisory: it is not a required status check.
    name: windows/specific
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install canonical Python dependencies
        # The suite's set, not the union: the lint tooling is about thirty
        # packages this job's tests never touch.
        run: python scripts/dev_checks.py install-python --set test
      - name: Run the Windows-specific tests
        run: python scripts/dev_checks.py test-windows

  dependency-audit:
    # Advisory: it is not a required status check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Audit server, desktop and build dependencies
        run: |
          # `setuptools` is the version `pyproject.toml` pins as the build
          # backend, and `pyinstaller` builds the shipped binary -- both are
          # pinned so a new release of either cannot change what is built
          # without a pull request.
          python -m pip install --upgrade pip 'setuptools==84.2.1'
          python -m pip install -r requirements-dev.txt '.[desktop,sidecar]' 'pyinstaller==6.22.3'
          pip-audit --skip-editable
      - name: Audit frontend including build dependencies
        run: |
          npm --prefix webapp ci
          npm --prefix webapp audit

  installer-check:
    # Compile the Windows NSIS installer on every PR (placeholder exe — the real
    # one is built on windows-latest by sidecar-build.yml) so a broken .nsi or
    # a missing installer asset fails here, not at release time.
    #
    # Advisory: it is not a required status check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Compile installer
        run: |
          mkdir -p dist
          printf 'MZ placeholder' > dist/RunwaySidecar.exe
          # The same helper the Windows release leg and the Windows PR gate
          # use — one asset name, one computed output path.
          python3 -m scripts.build_windows_installer --label edge --strict
          ls -l *-setup.exe

  image-changed:
    # Did this push change anything that goes into the image? A docs-only or
    # test-only merge does not, and rebuilding and re-pushing both image
    # arches for it is four minutes of runner time.
    #
    # The paths below mirror the COPY lines in the Dockerfile, which is what
    # decides the image's contents: the Dockerfile, requirements.txt, app/ and
    # the webapp/ the frontend builder compiles. A change to anything else
    # leaves the contents unchanged.
    #
    # One thing does change on every commit: the Dockerfile bakes the commit
    # in as RUNWAY_BUILD_SHA, so a rebuilt image is never byte-identical to
    # its predecessor. Skipping the rebuild therefore leaves :edge serving
    # the previous commit's image, and that image's SHA. The SHA still names
    # the exact build that is running -- it is the SHA of the *build*, not of
    # main -- but it is no longer main's tip. Rebuilding every time costs
    # about four minutes per main push, roughly one percent of this
    # repository's CI; this keeps the contents honest and accepts the lag.
    #
    # If the base commit cannot be found the answer is "changed", so an
    # unresolvable comparison rebuilds rather than silently skipping the
    # publish.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: check
        name: Compare the push against the image inputs
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          changed=true
          if [ -n "$before" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            if git diff --name-only "$before" HEAD -- \
              | grep -qE '^(Dockerfile|\.dockerignore|requirements\.txt)$|^app/|^webapp/'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-docker:
    # A failed dependency-audit stops the edge publish: GitHub skips a
    # dependent job when one of its `needs:` fails, so no `:edge` tag is
    # moved until the audit is green. That is deliberate - a vulnerable
    # dependency graph must not ship - but it means a fresh advisory
    # reddens `main` and freezes the moving tag until it is fixed. See #744.
    needs: [test-python, test-frontend, dependency-audit, image-changed]
    if: github.event_name == 'push' && needs.image-changed.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-name: 's3ntin3l8/runway'
      push-edge: true
    secrets: inherit
