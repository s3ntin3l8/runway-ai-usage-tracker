name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    uses: s3ntin3l8/.github/.github/workflows/ci-python.yml@bd7f8eaa4f2e212185e042472ec790f13374ce1f # main
    with:
      python-version: '3.12'
      coverage-fail-under: '70'
    secrets: inherit

  test-frontend:
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@bd7f8eaa4f2e212185e042472ec790f13374ce1f # main
    with:
      node-version: '22'
      working-directory: 'webapp'
      cache-dependency-path: 'webapp/package-lock.json'
      build-script: 'build'
      # 'test:coverage' emits coverage/coverage-summary.json (vitest v8), which
      # turns on the reusable workflow's Codecov upload for the frontend.
      test-script: 'test:coverage'
      # Gate on total line coverage (currently ~93%); buffer for variance.
      coverage-fail-under: '85'
      strict-checks: true
    secrets: inherit

  windows-native-lint:
    # Native Windows coverage of the static checks. The suite itself runs in
    # the sharded windows-native-pytest matrix below.
    runs-on: windows-latest
    # ruff + mypy + pip-audit take ~1.2 minutes on a healthy runner; the budget
    # only has to absorb a very slow runner, not the suite.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install canonical Python dependencies
        run: python scripts/dev_checks.py install-python
      - name: Run the native Windows static gate
        run: python scripts/dev_checks.py lint

  windows-native-pytest:
    # The suite takes 11-27 minutes on hosted Windows runners depending on how
    # fast the runner is, which is what pushed the old monolithic job into its
    # 30-minute timeout and failed the release publish (#712). Four parallel
    # shards keep every shard far below the timeout: the plan splits whole test
    # modules and balances them by measured runtime, so no shard runs long
    # enough to matter even on a slow runner.
    #
    # The frontend is deliberately not part of this job. `test-frontend /
    # lint-and-test` already runs vitest and builds the SPA on Linux, and the
    # frontend suite is platform independent - re-running it here only added
    # 2.5 minutes to the critical path.
    name: windows-native-pytest (shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    # 45 minutes survives a runner several times slower than median: a shard
    # is about a quarter of the suite, so even a 4x-slow runner finishes it in
    # well under 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install canonical Python dependencies
        run: python scripts/dev_checks.py install-python
      - name: Run the shard
        env:
          RUNWAY_PYTEST_SHARD_ID: ${{ matrix.shard }}
          RUNWAY_PYTEST_SHARDS: '4'
        run: python scripts/dev_checks.py test-shard

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Audit server, desktop and build dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -r requirements-dev.txt '.[desktop,sidecar]' pyinstaller
          pip-audit --skip-editable
      - name: Audit frontend including build dependencies
        run: |
          npm --prefix webapp ci
          npm --prefix webapp audit

  installer-check:
    # Compile the Windows NSIS installer on every PR (placeholder exe — the real
    # one is built on windows-latest by sidecar-build.yml) so a broken .nsi or
    # a missing installer asset fails here, not at release time.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Compile installer
        run: |
          mkdir -p dist
          printf 'MZ placeholder' > dist/RunwaySidecar.exe
          # The same helper the Windows release leg and the Windows PR gate
          # use — one asset name, one computed output path.
          python3 -m scripts.build_windows_installer --label edge --strict
          ls -l *-setup.exe

  build-docker:
    needs: [test-python, test-frontend, dependency-audit]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-name: 's3ntin3l8/runway'
      push-edge: true
    secrets: inherit
