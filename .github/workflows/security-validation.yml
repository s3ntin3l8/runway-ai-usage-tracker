name: Security Validation
# The trust-boundary and recovery tests. The packaging half of this workflow
# -- the frozen-binary smoke test across the four platforms -- lives in
# frozen-verifier.yml, which runs on pushes to `main` and nightly instead of
# on every pull request. The release verification moved with it: dispatch
# frozen-verifier.yml with a release tag to capture and verify a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  # Without a group, every push to a pull request leaves the previous run
  # going until it finishes on its own.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-boundaries:
    name: Browser boundaries (Chromium, Firefox and WebKit)
    runs-on: ubuntu-24.04
    # The image carries the browsers and their system dependencies, so this
    # job runs no apt transaction and downloads no browser. The budget covers
    # the image pull, pip, npm and the browser matrix.
    timeout-minutes: 25
    # The runner points HOME at a directory the image's pwuser owns, but the
    # steps of a container job run as root, and Firefox refuses to start as
    # root with a home owned by somebody else ("Running Nightly as root in a
    # regular user's session is not supported"). Playwright's own advice for
    # this image is to point HOME at root's home.
    env:
      HOME: /root
    container:
      # The browsers and the system libraries they need are baked into this
      # image at build time. That is the point of it: `playwright install
      # --with-deps` unconditionally runs `apt-get update` against the
      # runner's apt mirror, and a stalled mirror took 39 minutes and 27
      # seconds of this job's budget on 2026-10-23 (#876) -- the browser
      # checks never ran at all. The image also carries no Python and no
      # repository-pinned Node, so setup-python and setup-node provide those.
      #
      # The tag follows the locked playwright-core version in
      # webapp/package-lock.json, and scripts/check_workflow_pins.py fails the
      # build when the two disagree. The digest is the multi-arch index
      # digest; docs/security-validation.md records how to resolve it again.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          # The suite's set, not the union: this job runs tests, not the
          # lint gate.
          .venv/bin/pip install -r requirements-test.txt
      - name: Register the toolchain's shared library
        # setup-python's Linux build has an empty RUNPATH, so its interpreter
        # finds libpython only through LD_LIBRARY_PATH. The browser matrix
        # starts the test server as a child process of node, and there the
        # variable did not reach the dynamic loader: the job failed with
        # "error while loading shared libraries: libpython3.12.so.1.0" before
        # a single check ran. The image carries no other libpython -- the
        # ubuntu base has no Python at all -- so registering the directory
        # with the linker makes the interpreter work wherever it is started.
        run: |
          echo "${pythonLocation:?the toolchain location is not set}/lib" > /etc/ld.so.conf.d/runway-python.conf
          ldconfig
      - name: Verify the toolchain
        # The versions are printed so a mismatch shows up in the log instead
        # of surfacing as an opaque `npm ci` refusal: webapp/package.json
        # states the floors as devEngines with onFail: error, so npm enforces
        # them on install. The interpreter is then started the way the browser
        # matrix starts it -- as a child process of node -- so the failure
        # mode above is caught here, by name, instead of surfacing as a
        # cryptic Playwright error.
        run: |
          node --version
          npm --version
          .venv/bin/python --version
          node -e '
            const { spawnSync } = require("child_process");
            const result = spawnSync(".venv/bin/python", ["--version"], { encoding: "utf8" });
            if (result.status !== 0) {
              console.error("the interpreter does not start as a child process:", result.stderr);
              process.exit(1);
            }
            console.log("as a child process:", result.stdout.trim());
          '
      - name: Install webapp dependencies
        run: npm --prefix webapp ci
      - name: Browser boundaries
        run: npm --prefix webapp run test:security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-security-report
          path: webapp/playwright-report
  proxy-trust-boundaries:
    name: Real reverse-proxy trust boundaries
    runs-on: ubuntu-24.04
    # The proxy test needs the Python set and Docker; it needs no browser, so
    # it no longer shares a job with the browser matrix. A stalled package
    # mirror cannot spend this job's budget, and the pin check below runs
    # whatever the browser job does.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          # The suite's set, not the union: this job runs tests, not the
          # lint gate.
          .venv/bin/pip install -r requirements-test.txt
      - name: Check immutable CI references
        run: python scripts/check_workflow_pins.py
      - name: Real reverse-proxy trust boundaries
        env:
          RUNWAY_PROXY_TEST: '1'
        run: |
          export RUNWAY_CONFIG_DIR="$(mktemp -d)"
          .venv/bin/pytest tests/security/test_real_proxy.py
  native-windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native recovery test dependencies
        # The suite's set, not the union: this job runs tests, not the lint
        # gate.
        run: python -m pip install -r requirements-test.txt
      - name: Native Windows swap, rollback and recovery regressions
        run: python -m pytest tests/unit/test_self_update.py tests/unit/test_windows_native_boundaries.py --junitxml=native-windows-recovery.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-windows-recovery
          path: native-windows-recovery.xml
          if-no-files-found: error
          retention-days: 90
