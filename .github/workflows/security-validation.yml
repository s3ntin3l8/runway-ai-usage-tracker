name: Security Validation
# The trust-boundary and recovery tests. The packaging half of this workflow
# -- the frozen-binary smoke test across the four platforms -- lives in
# frozen-verifier.yml, which runs on pushes to `main` and nightly instead of
# on every pull request. The release verification moved with it: dispatch
# frozen-verifier.yml with a release tag to capture and verify a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  # Without a group, every push to a pull request leaves the previous run
  # going until it finishes on its own.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Cache Playwright browsers
        # The browser binaries are a ~150 MB download that `playwright install`
        # repeated on every run. The version follows the playwright release in
        # package-lock.json, so the lockfile's hash is the right cache key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install security test dependencies
        run: |
          python -m venv .venv
          # The suite's set, not the union: this job runs tests, not the
          # lint gate.
          .venv/bin/pip install -r requirements-test.txt
          npm --prefix webapp ci
          cd webapp && npx playwright install --with-deps
      - name: Check immutable CI references
        run: python scripts/check_workflow_pins.py
      - name: Browser boundaries
        run: npm --prefix webapp run test:security
      - name: Real reverse-proxy trust boundaries
        env:
          RUNWAY_PROXY_TEST: '1'
        run: |
          export RUNWAY_CONFIG_DIR="$(mktemp -d)"
          .venv/bin/pytest tests/security/test_real_proxy.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-security-report
          path: webapp/playwright-report
  native-windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native recovery test dependencies
        # The suite's set, not the union: this job runs tests, not the lint
        # gate.
        run: python -m pip install -r requirements-test.txt
      - name: Native Windows swap, rollback and recovery regressions
        run: python -m pytest tests/unit/test_self_update.py tests/unit/test_windows_native_boundaries.py --junitxml=native-windows-recovery.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-windows-recovery
          path: native-windows-recovery.xml
          if-no-files-found: error
          retention-days: 90
