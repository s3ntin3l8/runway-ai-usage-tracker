name: Synthetic Keychain investigation
on:
  workflow_dispatch:
    inputs:
      case:
        description: Synthetic case (control performs no item update)
        type: choice
        default: read-only-control
        options:
          - read-only-control
          - reference-control
          - writer-read-control
          - metadata-control
          - data-only
          - legacy-data
          - combined-access
          - all
permissions:
  contents: read
jobs:
  public-update:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      RUNWAY_NATIVE_SYNTHETIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Selected synthetic case with process-group deadline
        timeout-minutes: 2
        env:
          RUNWAY_SYNTHETIC_CASE: ${{ inputs.case }}
        run: python tests/native_keychain_ci.py --report keychain-report.json --case "$RUNWAY_SYNTHETIC_CASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-keychain-report
          path: keychain-report.json
          if-no-files-found: error
          retention-days: 30
