name: Update visual baselines

# `/update-baselines` on a pull request regenerates visual/baselines in CI and pushes them to the PR branch as one
# commit (write access, same-repository branch only). The shared workflow in s3ntin3l8/.github
# (visual-baselines.yml) does the work and refuses anything else with a reply; `workflow_dispatch` takes a PR number.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  baselines:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/update-baselines')) }}
    uses: s3ntin3l8/.github/.github/workflows/visual-baselines.yml@main
    with:
      pr-number: ${{ inputs.pr }}
      max-diff-pixels: 50
      python-version: "3.12"
      node-version: "24"
