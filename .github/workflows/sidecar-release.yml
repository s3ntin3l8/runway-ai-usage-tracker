name: Sidecar Release Build

# Manual (re)build of the sidecar installers + payloads via the shared
# sidecar-build.yml matrix. Stable releases normally build automatically from
# release-please.yml (tag-push/release events don't fire when GITHUB_TOKEN
# creates the tag/release, hence the explicit call there).
#
# * `tag` empty  → build-only: the signed asset set is left as the
#   `sidecar-release-assets` workflow artifact (handy for testing the .dmg /
#   setup.exe from a branch before merging).
# * `tag` set    → rebuild that tag and (re)upload its assets to the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload to (e.g. v2.13.0). Empty = build-only.
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      label: ${{ steps.r.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "label=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    permissions:
      contents: read
      id-token: write  # Sigstore signing in sidecar-build.yml's attest job
    uses: ./.github/workflows/sidecar-build.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      label: ${{ needs.resolve.outputs.label }}

  upload:
    needs: [resolve, build]
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed asset set
        uses: actions/download-artifact@v8
        with:
          name: sidecar-release-assets
          path: release-assets

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
