name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A manual Run (Mullion's button) must not race a push-triggered run: both would
# open the same tag and publish the same image tags and sidecar assets. Queue, never
# cancel, so a running release is not interrupted.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # A dispatch can start from any ref, and the publish jobs below load their
    # workflow files from the dispatched ref (`uses: ./...`). Release from main only;
    # a skipped job leaves release_created empty, so every publish job is skipped.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: 's3ntin3l8/runway'
      push-release: true
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      release-channel: ${{ contains(needs.release-please.outputs.tag_name, '-beta.') && 'beta' || 'stable' }}
      # See ci-cd.yml: audits the candidate, then signs and promotes that digest.
      audit-command: python -m scripts.audit_release_image --output image-audit
    secrets: inherit

  build-sidecar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write  # Sigstore signing in sidecar-build.yml's attest job
    uses: ./.github/workflows/sidecar-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      label: ${{ needs.release-please.outputs.tag_name }}

  publish-sidecar:
    needs: [release-please, build-sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sidecar-release-assets
          path: release-assets

      - name: Upload to GitHub Release
        # .dmg / -setup.exe installers, .zip / .tar.gz self-update payloads,
        # per-asset .sha256, SHA256SUMS.txt and Sigstore .sigstore.json bundles.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
