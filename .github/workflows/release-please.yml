name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: 's3ntin3l8/runway'
      push-release: true
      release-tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  build-sidecar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write  # Sigstore signing in sidecar-build.yml's attest job
    uses: ./.github/workflows/sidecar-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      label: ${{ needs.release-please.outputs.tag_name }}

  publish-sidecar:
    needs: [release-please, build-sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed asset set
        uses: actions/download-artifact@v8
        with:
          name: sidecar-release-assets
          path: release-assets

      - name: Upload to GitHub Release
        # .dmg / -setup.exe installers, .zip / .tar.gz self-update payloads,
        # per-asset .sha256, SHA256SUMS.txt and Sigstore .sig/.cert files.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
