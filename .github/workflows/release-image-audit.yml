name: Immutable Release Image Audit
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'ghcr.io/s3ntin3l8/runway@sha256:<manifest digest>'
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  inventory-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect immutable package inventories and vulnerability reports
        env:
          AUDIT_IMAGE: ${{ inputs.image }}
        run: python -m scripts.audit_release_image "$AUDIT_IMAGE" --output image-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: immutable-image-audit
          path: image-audit
          retention-days: 90
