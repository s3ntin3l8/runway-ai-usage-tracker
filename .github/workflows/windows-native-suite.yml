name: Windows Native Suite

# The whole pytest suite on a native Windows runner.
#
# It used to run on every pull request, in four parallel shards. That cost
# ~11 runner-minutes per pull request -- the largest advisory cost in the
# repository -- for coverage that a Windows runner is not the only way to
# get: most of the suite is platform independent and the Linux job already
# runs it.
#
# What stays on every pull request is `windows/specific` in ci-cd.yml: the
# modules whose subject is the Windows platform (native socket and handle
# semantics, installer packaging, console code pages). The full suite runs
# here, on main pushes and nightly, so a Windows-only regression in any
# module still surfaces -- just on a slower cadence than before.
#
# Four parallel shards, because the suite takes 11-27 minutes on a hosted
# Windows runner depending on how fast the runner is, which is what pushed
# the old monolithic job into its 30-minute timeout (#712). The plan splits
# whole test modules and balances them by measured runtime, so no shard runs
# long enough to matter even on a slow runner.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      record-weights:
        description: >-
          Record the per-module durations on Windows and upload them as an
          artifact, instead of running the shards. The artifact is the new
          `tests/shard_durations.windows.json`; commit it.
        required: false
        type: boolean
        default: false
      system-python:
        description: >-
          Use the runner's Python instead of building a .venv. Set to false
          to measure the two paths against each other: the .venv costs a venv
          creation and a second pip upgrade on every run.
        required: false
        type: boolean
        default: true

concurrency:
  # The event name is part of the group, so the nightly schedule and a push
  # to `main` -- which share `github.ref` -- do not land in the same group
  # and cannot cancel or queue behind each other. The nightly run is the
  # backstop for the narrowed per-pull-request Windows gate.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native-pytest:
    name: windows-native-pytest (shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    # 45 minutes survives a runner several times slower than median: a shard
    # is about a quarter of the suite, so even a 4x-slow runner finishes it in
    # well under 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install canonical Python dependencies
        run: python scripts/dev_checks.py install-python
        env:
          # The runner is a fresh virtual machine per job, so its Python is
          # already isolated. Building a .venv on top of it costs a venv
          # creation and a second pip upgrade on every run, for a dependency
          # install that is already cached.
          RUNWAY_SYSTEM_PYTHON: ${{ inputs.system-python && '1' || '0' }}
      # Four workers inside the shard as well: the runner has four cores,
      # and `--dist loadfile` keeps each test module in one worker.
      - name: Run the shard
        env:
          RUNWAY_PYTEST_SHARD_ID: ${{ matrix.shard }}
          RUNWAY_PYTEST_SHARDS: '4'
          RUNWAY_TEST_JOBS: '4'
          RUNWAY_SYSTEM_PYTHON: ${{ inputs.system-python && '1' || '0' }}
        run: python scripts/dev_checks.py test-shard

  record-shard-weights:
    # Measure the per-module durations on Windows, so the shards above are
    # planned with Windows measurements. Measured on Linux they leave the
    # shards minutes apart: a module that is slow on Linux is not necessarily
    # slow on Windows.
    #
    # Manual, because the table only changes when the suite's shape does.
    # The artifact it uploads is the new `tests/shard_durations.windows.json`;
    # committing that file is the last step.
    if: github.event_name == 'workflow_dispatch' && inputs.record-weights
    name: record-shard-weights
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install canonical Python dependencies
        run: python scripts/dev_checks.py install-python
        env:
          RUNWAY_SYSTEM_PYTHON: '1'
      - name: Record the per-module durations
        run: python scripts/dev_checks.py record-shard-weights --jobs 4
        env:
          RUNWAY_SYSTEM_PYTHON: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shard-durations-windows
          path: tests/shard_durations.windows.json
          if-no-files-found: error
          retention-days: 30
