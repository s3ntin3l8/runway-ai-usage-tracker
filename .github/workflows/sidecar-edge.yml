name: Sidecar Edge Build

# Rolling per-commit sidecar build — the sidecar analog of the Docker :edge tag.
# Publishes the macOS .dmg, Windows setup.exe, and the Linux/macOS/Windows
# self-update payloads (built by the shared sidecar-build.yml matrix) to a
# single, always-overwritten `edge` GitHub *prerelease* so the download URLs
# stay constant. Because it is a prerelease, GitHub's /releases/latest never
# returns it, so the stable update-notify channel is untouched.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sidecar.py'
      - 'scripts/sidecar_pkg/**'
      - 'sidecar_app/**'
      - 'package.json'
      - 'installer/**'
      - '.github/workflows/sidecar-build.yml'
      - '.github/workflows/sidecar-edge.yml'
  workflow_dispatch:

concurrency:
  # Rolling release — only the newest main push needs to win.
  group: sidecar-edge
  cancel-in-progress: true

jobs:
  guard:
    # Edge is "rolling = tip of main". Refuse to build/publish a stale or divergent
    # commit: re-runs execute at the original (possibly rebased-out) SHA, and a
    # workflow_dispatch can target any ref. Either would force-move the `edge` tag to
    # a commit that isn't main's tip and ship a misleading +edge.<sha> (issue #106).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify HEAD is the tip of origin/main
        shell: bash
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "HEAD=$HEAD_SHA  origin/main=$MAIN_SHA"
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::Could not resolve origin/main tip."; exit 1
          fi
          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Refusing edge build: HEAD ($HEAD_SHA) is not the tip of origin/main ($MAIN_SHA). Edge builds only the current tip of main; stale/divergent dispatches and re-runs are rejected (issue #106)."
            exit 1
          fi
          echo "OK — building the current tip of main."

  build:
    needs: guard
    permissions:
      contents: read
      id-token: write  # Sigstore signing in sidecar-build.yml's attest job
    uses: ./.github/workflows/sidecar-build.yml
    with:
      ref: ${{ github.sha }}
      label: edge
      # A flaky macOS/Windows runner must not hold back the rest of the
      # rolling channel — publish whatever built.
      allow-partial: true

  publish:
    needs: [guard, build]
    # Publish whatever built — a single failed platform leg shouldn't hold back
    # the rest of the rolling edge channel (sidecar-build's attest job still
    # runs on a partial set) — but a failed guard must stop the force-tag +
    # prerelease entirely (without the explicit guard check `!cancelled()`
    # would still run publish when build was skipped because the guard failed).
    # The signed set only exists if attest succeeded; download fails otherwise.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download signed asset set
        uses: actions/download-artifact@v8
        with:
          name: sidecar-release-assets
          path: edge-dist

      - name: Move rolling edge tag
        # softprops/action-gh-release does not move an existing tag; force it to
        # this commit so the auto-attached source archive matches the binaries.
        run: |
          git tag -f edge
          git push -f origin edge

      - name: Publish to rolling edge prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: edge
          prerelease: true
          name: "Edge (rolling)"
          body: "Rolling sidecar build from ${{ github.sha }}. Not a stable release."
          files: edge-dist/*
