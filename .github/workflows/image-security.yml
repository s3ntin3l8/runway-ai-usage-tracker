name: Image Security

# Scans the candidate image for known vulnerabilities.
#
# The candidate leg runs on the pull requests that touch the image: the
# paths below are the COPY lines in the Dockerfile, which is what decides the
# image's contents -- the Dockerfile, requirements.txt, app/ and the webapp/
# the frontend builder compiles. A change that cannot affect the image does
# not pay for a build and a scan.
#
# The arm64 leg lives in its own workflow (image-security-arm64.yml) because
# it is a *native* build on an ARM runner, which costs about as much as the
# amd64 leg.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app/**'
      - 'webapp/**'
      - 'scripts/audit_release_image.py'
      - 'scripts/image_policy.py'
      - '.github/workflows/image-security.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  # The event name is part of the group: the daily `schedule` run and a
  # `workflow_dispatch` on `main` share `github.ref`, so without it they
  # land in the same group and one cancels the other -- and the one that
  # gets cancelled is a 45-minute audit of the released image.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event_name == 'pull_request'
    name: candidate (ubuntu-24.04, amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and scan candidate without publishing
        env:
          ARCH: amd64
        run: |
          docker build -t runway-candidate .
          docker run --rm -e APP_HOST=127.0.0.1 -e RUNWAY_CONFIG_DIR=/tmp/ci --entrypoint python runway-candidate -c 'import app.main, sqlite3; print(sqlite3.sqlite_version)'
          docker save --output /tmp/candidate.tar runway-candidate
          python -m scripts.audit_release_image --archive /tmp/candidate.tar --architecture "$ARCH" --output image-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: image-security-amd64
          path: image-audit
          retention-days: 90
  published:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit published edge and newest versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .tag_name != "edge")] | sort_by(.created_at) | last | .tag_name')
          test -n "$RELEASE" && test "$RELEASE" != null
          export RELEASE
          python -m scripts.audit_published_images --release "$RELEASE" --output image-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: published-image-security
          path: image-audit
          retention-days: 90
