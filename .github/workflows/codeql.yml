name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The merge queue runs the required checks against the merge commit, so
  # CodeQL has to report on that commit too.
  merge_group:
    types: [ checks_requested ]
  schedule:
    - cron: '37 1 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run: the queue needs it to finish before it
  # can merge, and a cancelled run reads as a failed check.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: s3ntin3l8/.github/.github/workflows/codeql.yml@bd7f8eaa4f2e212185e042472ec790f13374ce1f # main
    with:
      languages: '"python", "javascript-typescript"'
