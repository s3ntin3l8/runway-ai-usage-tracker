name: npm audit (weekly)

# Advisory only. `dependency-audit` in ci-cd.yml blocks on the shipped tree at any
# severity and on the whole tree at moderate and up, so a low-severity finding in
# the dev-only tree (for example GHSA-gcqx-w48m-w2h4 in deepmerge) shows up only in
# a job log that expires. This run lists every finding, at every severity, in the
# job summary and keeps it in one tracking issue that it edits, closes and reopens
# rather than opening a new issue per run. Nothing needs this workflow and it is
# not a required check (#1035).

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-audit-weekly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: 'chore(deps): npm audit findings in the frontend tree'
      ISSUE_LABEL: npm-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install and audit the whole tree at every severity
        run: |
          npm --prefix webapp ci
          # `npm audit` exits non-zero when it finds anything; the report is the
          # product here, so the exit status is read from the JSON instead.
          npm --prefix webapp audit --json > "$RUNNER_TEMP/audit.json" || true
      - name: Render the report
        run: |
          node --input-type=module <<'EOF' > "$RUNNER_TEMP/report.md"
          import { readFileSync } from 'node:fs'
          const audit = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/audit.json`, 'utf8'))
          if (audit.error) {
            console.error(audit.error.summary ?? 'npm audit failed')
            process.exit(1)
          }
          const order = ['critical', 'high', 'moderate', 'low', 'info']
          const rows = Object.values(audit.vulnerabilities ?? {})
            .map((v) => ({
              name: v.name,
              severity: v.severity,
              // A transitive package is traced up to what pulls it in, so a row can be followed to
              // the direct dependency without opening the log.
              direct: v.isDirect ? 'direct' : `transitive → ${(v.effects ?? []).join(', ') || '?'}`,
              advisories: v.via
                .filter((x) => typeof x === 'object')
                .map((x) => `[${x.title}](${x.url})`)
                .join(', ') || 'via ' + v.via.join(', '),
              // `fixAvailable` is `true` only for a plain `npm audit fix`. The object form names a
              // parent package to move to, often a semver-major change (here the vite-plugin-pwa
              // downgrade ci-cd.yml refuses), so it is printed as that and never as "available".
              fix:
                v.fixAvailable === true
                  ? 'npm audit fix'
                  : v.fixAvailable
                    ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                    : 'none',
            }))
            .sort((a, b) => order.indexOf(a.severity) - order.indexOf(b.severity) || a.name.localeCompare(b.name))
          const out = []
          out.push(`${rows.length} vulnerable package(s) in \`webapp/\` (all severities, build tooling included).`, '')
          if (rows.length) {
            out.push('| Package | Severity | Reached | Advisory | Suggested fix |', '| --- | --- | --- | --- | --- |')
            for (const r of rows) out.push(`| \`${r.name}\` | ${r.severity} | ${r.direct} | ${r.advisories} | ${r.fix} |`)
          }
          console.log(out.join('\n'))
          EOF
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "FINDINGS=$(jq '.vulnerabilities | length' "$RUNNER_TEMP/audit.json")" >> "$GITHUB_ENV"
      - name: Update the tracking issue
        # The token is scoped to this step: `npm ci` above runs the whole tree's install scripts
        # and must not see an `issues: write` token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ISSUE_LABEL" --color FBCA04 \
            --description 'Scheduled npm audit tracking issue' 2>/dev/null || true
          number=$(gh issue list --state all --label "$ISSUE_LABEL" --limit 1 \
            --json number --jq '.[0].number // empty')
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "_Last run: $(date -u +%Y-%m-%dT%H:%MZ), [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This issue is edited by the weekly audit; do not close it by hand._"
          } > "$RUNNER_TEMP/body.md"
          if [ "$FINDINGS" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
              gh issue reopen "$number" 2>/dev/null || true
            else
              gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" \
                --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            gh issue close "$number" --comment 'The weekly audit found no vulnerable packages.' 2>/dev/null || true
          fi
