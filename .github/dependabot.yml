version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns:
          - "*"
        # The requirements are pinned exactly, so a weekly pull request is a
        # proposal to move a pin. Weekly pull requests carry minor and patch
        # bumps only: a major is a migration, not a weekly batch, and the
        # same rule the npm group below already follows. A security update is
        # not one of these -- Dependabot proposes those regardless.
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    # The npm project lives in webapp/; the repository root only holds a
    # script wrapper with no dependencies and no lockfile of its own.
    directory: /webapp
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-deps:
        patterns:
          - "*"
        # Weekly pull requests carry minor and patch bumps only. A major is a
        # migration, not a weekly batch: the first run of this group proposed
        # 34 updates including seven majors, and could not be reviewed or
        # merged as one.
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the Go rewrite of the compiler, not a version bump:
      # the tooling around it has not caught up yet, and taking it here is a
      # migration rather than a dependency update. #742 already had to drop
      # the baseUrl option that 7 removed. Track the migration in #757 and
      # lift this when it is time.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
