version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    # The npm project lives in webapp/; the repository root only holds a
    # script wrapper with no dependencies and no lockfile of its own.
    directory: /webapp
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-deps:
        patterns:
          - "*"
