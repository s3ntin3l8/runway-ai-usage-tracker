[build-system]
# Pinned exactly, like the dependencies below: the build backend is what
# produces the shipped binary, and a floating one makes the artifact depend
# on the day it was built.
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runway"
version = "3.0.0-beta.16" # x-release-please-version
requires-python = ">=3.12"
# Pinned exactly, not "at least" -- the same set as `requirements.txt`, and
# the same reason: this is the manifest the shipped sidecar is built from.
# `sidecar-build.yml` installs from here and never from `requirements.txt`,
# so a floating range here would reach the user's binary with no pull
# request and no commit.
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    # `httpx` pulls `certifi` in, but only with a floor -- so the CI set and
    # the shipped set would agree by luck rather than by pin. It is declared
    # here, at the version the shipped sidecar is built with, so both sets
    # resolve to the same one.
    "certifi==2026.10.19",
    "python-dotenv==1.2.4",
    "aiosqlite==0.22.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "keyring==25.7.0",
    "cryptography==50.0.2",
    "secretstorage==3.5.0",
    "PyYAML==6.0.3",
    "slowapi==0.1.10",
    "sqlmodel==0.0.48",
    "tzdata==2026.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
sidecar = ["sigstore==4.5.1"]
desktop = [
    "pystray==0.19.5",
    "Pillow==13.0.0",
    "packaging==26.3",
]

# Explicit package discovery — setuptools can't auto-discover with multiple
# top-level dirs (app, assets, frontend, sidecar_app) under flat layout.
[tool.setuptools.packages.find]
include = ["app*", "sidecar_app*", "scripts*"]
exclude = ["tests*", "docs*", "assets*", "frontend*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "sidecar_app/spec",
    "scratch",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "S", "B", "A", "C4", "DTZ", "SIM", "RET", "ARG", "ERA", "PL"]
ignore = [
    # PLR0913 (too many arguments) and PLR0915 (too many statements) are now
    # enabled per audit R12 — they reliably catch kitchen-sink functions.
    # PLR2004 (magic value) stays off: 130 hits across the codebase, almost
    # all HTTP status codes, seconds-per-X conversions, and percentage
    # thresholds. Constant-ifying them is busywork that adds no clarity.
    "S101",    # Use of assert
    "RET504",  # Unnecessary assignment before return
    "B008",    # Do not perform function call `Depends` in argument defaults
    "S105",    # Possible hardcoded password (noisy in tests)
    "PLR2004", # Magic value used in comparison (see comment above)
    "PLC0415", # import should be at the top-level
    "PLR0912", # Too many branches
    "B904",    # raise ... from err
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "E701",    # Multiple statements on one line
    "S110",    # try-except-pass
    "SIM102",  # nested-if
    "S112",    # try-except-continue
    "N806",    # Variable in function should be lowercase
    "C414",    # Unnecessary list call within sorted
    "ERA001",  # Found commented-out code
    "E402",    # Module level import not at top of file
    "PLW0603", # Using global statement
    "PLW0602", # Using global for ... but no assignment
    "PLW2901", # loop variable overwritten
    "PLW1510", # subprocess.run without explicit check
    "PLR0911", # Too many return statements
    "B905",    # zip() without explicit strict=
    "N801",    # Class name should use CapWords
    "B023",    # Function definition does not bind loop variable
    "SIM105",  # Use contextlib.suppress
    "SIM108",  # Use ternary operator
    "SIM103",  # Return condition directly
    "PLW0108", # Lambda may be unnecessary
    "S113",    # requests call without timeout
    "S108",    # Probable insecure usage of temporary file
    "N802",    # Function name should be lowercase
    "S603",    # subprocess untrusted input
    "S311",    # random not for crypto
    "S104",    # possible binding to all interfaces
    "B027",    # empty method in ABC
    "A001",    # shadowing builtin
    "B007",    # loop control variable not used
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pylint]
# Defaults are aggressive (5 args, 50 statements). Raise to values that
# only flag genuinely-too-large functions while keeping the audit's R12
# safety net against new god-functions creeping in.
max-args = 10
max-statements = 75

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "F841", "SIM", "DTZ", "PLR", "S", "B018"]
"scripts/*" = ["ARG", "F841", "SIM", "DTZ", "PLR", "S", "B018", "T201"]
"app/services/event_query.py" = ["S608"]
"app/services/queries/*.py" = ["S608"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = false
ignore_missing_imports = true
# Honour .gitignore the way ruff already does. The PyInstaller `build/` and
# `dist/` bundles copy `sidecar_app/assets/` into two different trees, so mypy
# sees the same module name twice and aborts the whole run with "Duplicate
# module named". CI never builds those trees, so only contributors who ran
# `make sidecar-app` locally hit it.
exclude_gitignore = true
# `scripts/` is excluded wholesale: it is a namespace package, so mypy finds
# `scripts/demo/env.py` under two module names and aborts the run, and
# bringing the directory in surfaces several dozen pre-existing errors that
# cannot be cleared without an unrelated namespace-package fix.
exclude = ["tests", "scripts", "sidecar_app", "scratch", "evidence"]

[[tool.mypy.overrides]]
module = "app.services.collectors.*"
ignore_errors = true

# Audit R13: tighten typing on the layers most prone to silent bugs.
# app.core.* + app.api.endpoints.* must declare argument and return
# types; the rest of the codebase keeps the lax default for now.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.api.endpoints.*"]
disallow_untyped_defs = true
check_untyped_defs = true
